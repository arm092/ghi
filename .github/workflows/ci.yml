name: Compiler and distribution
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./...
      - run: go vet ./...
      - name: Install pinned Delve
        run: go install github.com/go-delve/delve/cmd/dlv@v1.27.2
      - name: Debug original Ghi sources with real Delve
        shell: bash
        run: |
          export GHI_TEST_DLV="$(go env GOPATH)/bin/dlv"
          if [ "$RUNNER_OS" = Windows ]; then export GHI_TEST_DLV="$GHI_TEST_DLV.exe"; fi
          go test ./tests/debugger -v -count=1
      - name: Fuzz malformed Ghi syntax
        if: runner.os == 'Linux'
        run: go test ./internal/compiler -run '^$' -fuzz '^FuzzParseFile$' -fuzztime=20s -parallel=2
      - name: Install Task API dependencies with Mojave
        working-directory: examples/task-api
        run: go run ../../cmd/mojave install
      - name: Install DDD API dependencies with Mojave
        working-directory: examples/ddd-api
        run: go run ../../cmd/mojave install
      - name: Debug DDD HTTP controller with real Delve
        shell: bash
        run: |
          export GHI_TEST_DLV="$(go env GOPATH)/bin/dlv"
          if [ "$RUNNER_OS" = Windows ]; then export GHI_TEST_DLV="$GHI_TEST_DLV.exe"; fi
          export GHI_TEST_DDD="$GITHUB_WORKSPACE/examples/ddd-api"
          go test ./tests/debugger -run '^TestDelveDDDController$' -v -count=1
      - name: Verify Ghi developer tools and database API
        run: |
          go run ./cmd/ghi fmt --check ./examples/task-api
          go run ./cmd/ghi check ./examples/task-api
          go run ./cmd/ghi test -v ./examples/task-api
          go run ./cmd/ghi fmt --check ./examples/ddd-api
          go run ./cmd/ghi check ./examples/ddd-api
          go run ./cmd/ghi build ./examples/ddd-api
          go run ./cmd/ghi test -v ./examples/ddd-api
      - run: go run ./cmd/ghi run ./examples/hello
      - name: Test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          go build -o install/ghi.exe ./cmd/ghi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -o install/mojave.exe ./cmd/mojave
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash install/ghi.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  ghi.exe" | Set-Content install/ghi.sha256
          $hash = (Get-FileHash install/mojave.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  mojave.exe" | Set-Content install/mojave.sha256
          ./install/install.ps1 -InstallDir "$env:RUNNER_TEMP/ghi-installed" -NoPath
          & "$env:RUNNER_TEMP/ghi-installed/ghi.exe" run ./examples/hello
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/ghi-installed/mojave.exe" help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $failureTarget = "$env:RUNNER_TEMP/ghi-failed-install"
          New-Item -ItemType Directory -Path $failureTarget -Force | Out-Null
          Set-Content "$failureTarget/ghi.exe" 'previous executable'
          Set-Content "$failureTarget/mojave.exe" 'previous package manager'
          $env:GHI_GO = "$env:RUNNER_TEMP/missing-go.exe"
          $rejected = $false
          try { ./install/install.ps1 -InstallDir $failureTarget -NoPath } catch { $rejected = $true }
          if (!$rejected -or (Get-Content "$failureTarget/ghi.exe" -Raw).Trim() -ne 'previous executable') { throw 'Failed setup must preserve the previous executable.' }
          if ((Get-Content "$failureTarget/mojave.exe" -Raw).Trim() -ne 'previous package manager') { throw 'Failed setup must preserve Mojave.' }
          $env:GHI_GO = ''
          Copy-Item install/mojave.exe "$env:RUNNER_TEMP/mojave-verified.exe"
          Add-Content install/mojave.exe 'tampered'
          $rejected = $false
          try { ./install/install.ps1 -InstallDir $failureTarget -NoPath } catch { $rejected = $true }
          if (!$rejected -or (Get-Content "$failureTarget/ghi.exe" -Raw).Trim() -ne 'previous executable' -or (Get-Content "$failureTarget/mojave.exe" -Raw).Trim() -ne 'previous package manager') { throw 'Checksum failure must preserve both executables.' }
          Copy-Item "$env:RUNNER_TEMP/mojave-verified.exe" install/mojave.exe -Force -ErrorAction Stop
          # Remove every Go executable directory, then install into a fresh user cache.
          $env:Path = (($env:Path -split ';') | Where-Object { $_ -and !(Test-Path -LiteralPath (Join-Path $_ 'go.exe')) }) -join ';'
          $env:GHI_GO = ''
          $env:LOCALAPPDATA = "$env:RUNNER_TEMP/ghi-fresh-user"
          if (Get-Command go -ErrorAction SilentlyContinue) { throw 'Go must be absent from PATH for this check.' }
          ./install/install.ps1 -InstallDir "$env:RUNNER_TEMP/ghi-with-managed-go" -NoPath
          & "$env:RUNNER_TEMP/ghi-with-managed-go/ghi.exe" run ./examples/objects
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test macOS installer
        if: runner.os == 'macOS'
        run: |
          go build -o install/ghi ./cmd/ghi
          go build -o install/mojave ./cmd/mojave
          (cd install && shasum -a 256 ghi > ghi.sha256)
          (cd install && shasum -a 256 mojave > mojave.sha256)
          GHI_NO_PATH=1 GHI_INSTALL_DIR="$RUNNER_TEMP/ghi-installed" sh install/install.sh
          "$RUNNER_TEMP/ghi-installed/ghi" run ./examples/hello
          "$RUNNER_TEMP/ghi-installed/mojave" help
          mkdir -p "$RUNNER_TEMP/ghi-failed-install"
          printf 'previous executable\n' > "$RUNNER_TEMP/ghi-failed-install/ghi"
          printf 'previous package manager\n' > "$RUNNER_TEMP/ghi-failed-install/mojave"
          if GHI_GO="$RUNNER_TEMP/missing-go" GHI_NO_PATH=1 GHI_INSTALL_DIR="$RUNNER_TEMP/ghi-failed-install" sh install/install.sh; then exit 1; fi
          test "$(cat "$RUNNER_TEMP/ghi-failed-install/ghi")" = 'previous executable'
          test "$(cat "$RUNNER_TEMP/ghi-failed-install/mojave")" = 'previous package manager'
          cp install/mojave "$RUNNER_TEMP/mojave-verified"
          printf 'tampered' >> install/mojave
          if GHI_NO_PATH=1 GHI_INSTALL_DIR="$RUNNER_TEMP/ghi-failed-install" sh install/install.sh; then exit 1; fi
          test "$(cat "$RUNNER_TEMP/ghi-failed-install/ghi")" = 'previous executable'
          test "$(cat "$RUNNER_TEMP/ghi-failed-install/mojave")" = 'previous package manager'
          cp "$RUNNER_TEMP/mojave-verified" install/mojave
          export HOME="$RUNNER_TEMP/ghi-fresh-home"
          export XDG_CONFIG_HOME="$HOME/.config"
          export SHELL=/bin/zsh
          export PATH=/usr/bin:/bin:/usr/sbin:/sbin
          unset GHI_GO
          mkdir -p "$HOME"
          if command -v go; then echo 'Go must be absent from PATH for this check.'; exit 1; fi
          GHI_INSTALL_DIR="$HOME/compiler bin" sh install/install.sh
          GHI_INSTALL_DIR="$HOME/compiler bin" sh install/install.sh
          /bin/zsh -ic 'command -v ghi; ghi version'
          /bin/zsh -ic 'command -v mojave; mojave help'
          /bin/zsh -ic 'ghi run ./examples/objects'
          test "$(grep -Fc '# Ghi compiler' "$HOME/.zshrc")" = 1

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build all platform archives
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
        run: bash scripts/package.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: ghi-distributions
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ghi-distributions
          path: dist
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --verify-tag --prerelease --title "Ghi $TAG" --notes "Ghi compiler and Mojave package manager prerelease. Download the archive for your platform, extract it, and run the included installer. Go is installed automatically when needed. This is a pre-1.0 release; see the release notes for changes and compatibility limits."
