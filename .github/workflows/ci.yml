name: Compiler and distribution
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./...
      - run: go vet ./...
      - run: go run ./cmd/ghi run ./examples/hello
      - name: Test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          go build -o install/ghi.exe ./cmd/ghi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash install/ghi.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  ghi.exe" | Set-Content install/ghi.sha256
          ./install/install.ps1 -InstallDir "$env:RUNNER_TEMP/ghi-installed" -NoPath
          & "$env:RUNNER_TEMP/ghi-installed/ghi.exe" run ./examples/hello
      - name: Test macOS installer
        if: runner.os == 'macOS'
        run: |
          go build -o install/ghi ./cmd/ghi
          (cd install && shasum -a 256 ghi > ghi.sha256)
          GHI_INSTALL_DIR="$RUNNER_TEMP/ghi-installed" sh install/install.sh
          "$RUNNER_TEMP/ghi-installed/ghi" run ./examples/hello

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build all platform archives
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
        run: bash scripts/package.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: ghi-distributions
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ghi-distributions
          path: dist
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --verify-tag --prerelease --title "Ghi $TAG" --notes "Ghi compiler preview. Download the archive for your platform, extract it, and run the included installer. Go is installed automatically when needed."
