name: GoLand plugin
on:
  push:
    branches: [master]
    tags: ['goland-v*']
    paths: ['ide/goland/**', '.github/workflows/goland.yml']
  pull_request:
    paths: ['ide/goland/**', '.github/workflows/goland.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build compiler for integration test
        run: |
          go build -o "$RUNNER_TEMP/ghi" ./cmd/ghi
          echo "GHI_TEST_COMPILER=$RUNNER_TEMP/ghi" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, package and verify against GoLand
        working-directory: ide/goland
        run: bash gradlew test buildPlugin verifyPlugin --no-daemon
      - name: Checksum plugin
        working-directory: ide/goland/build/distributions
        run: sha256sum *.zip > checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ghi-goland-plugin
          path: ide/goland/build/distributions/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ghi-goland-test-reports
          path: ide/goland/build/reports/
  release:
    if: startsWith(github.ref, 'refs/tags/goland-v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ghi-goland-plugin
          path: dist
      - name: Publish GoLand plugin preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --json id >/dev/null 2>&1; then
            echo "Release $TAG is already published; preserving its assets."
            exit 0
          fi
          gh release create "$TAG" dist/* --verify-tag --prerelease --title "Ghi for GoLand $TAG" --notes "Ghi support for GoLand 2026.2. Install the ZIP through Settings > Plugins > Install Plugin from Disk. Requires the Ghi compiler. Includes syntax highlighting, comments, brace matching, Build/Run actions and compiler diagnostic links. Semantic completion and debugging are not included in this preview."
